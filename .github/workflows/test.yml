name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.neovim && 'nvim' || 'vim' }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { neovim: false, version: v8.2.0000 }
          - { neovim: false, version: stable }
          - { neovim: true, version: v0.9.5 }
          - { neovim: true, version: stable }
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: ${{ matrix.neovim }}
          version: ${{ matrix.version }}
      - name: Run tests
        run: ./test/run.sh
        env:
          VUE_TEST_EDITORS: ${{ matrix.neovim && 'nvim' || 'vim' }}

  shared:
    name: shared cases with vim-svelte-plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shared cases
        run: ./test/shared.sh
